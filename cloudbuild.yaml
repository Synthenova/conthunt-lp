# Build the combined image (legacy static site + Next.js site behind nginx), push it, deploy conthunt-lp and
# send ALL traffic to the new revision (the last step). This is the "go live" build: to test first, use
# cloudbuild.preview.yaml, which deploys a no-traffic revision behind the "preview" tag.
# Run by hand: gcloud builds submit --config cloudbuild.yaml .   (there is no deploy-on-push)
# Source upload is filtered by .gcloudignore; check it with: gcloud meta list-files-for-upload .
# Traffic: once a revision has been pinned (a --no-traffic preview deploy, or update-traffic --to-revisions),
# `gcloud run deploy` alone leaves new revisions at 0%. The last step runs `update-traffic --to-latest`, so
# a regular deploy always goes live and the service keeps following LATEST.
# The _NEXT_PUBLIC_* values are public (they ship in the browser bundle).
substitutions:
  _NEXT_PUBLIC_BACKEND_URL: 'https://mcp.conthunt.app'
  _NEXT_PUBLIC_APP_URL: 'https://agent.conthunt.app'
  # The revision's commit label (pass --substitutions=_COMMIT_SHA=$(git rev-parse HEAD)).
  _COMMIT_SHA: 'unknown'
# The default 600s is too short for the three-stage build (legacy build, pnpm install, next build).
timeout: 1800s
steps:
  # Build and push the image with BuildKit. Every stage's layers (npm install, pnpm install, next build) go
  # to the shared :buildcache tag that preview and main builds both read, so an unchanged stage is pulled
  # instead of rebuilt. A missing cache tag is only a warning. The image goes straight to the registry, not
  # the local daemon, which is why there is no separate push step or images: list.
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: bash
    args:
      - '-euc'
      - |
        docker buildx create --name cache --driver docker-container --use
        docker buildx build \
          --cache-from type=registry,ref=us-central1-docker.pkg.dev/$PROJECT_ID/conthunt-lp/website:buildcache \
          --cache-to type=registry,ref=us-central1-docker.pkg.dev/$PROJECT_ID/conthunt-lp/website:buildcache,mode=max,image-manifest=true,oci-mediatypes=true \
          --provenance=false \
          --build-arg NEXT_PUBLIC_BACKEND_URL=${_NEXT_PUBLIC_BACKEND_URL} \
          --build-arg NEXT_PUBLIC_APP_URL=${_NEXT_PUBLIC_APP_URL} \
          --label org.opencontainers.image.revision=${_COMMIT_SHA} \
          -t us-central1-docker.pkg.dev/$PROJECT_ID/conthunt-lp/website \
          -t us-central1-docker.pkg.dev/$PROJECT_ID/conthunt-lp/website:$BUILD_ID \
          --push \
          .
  # Deploy container image to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'conthunt-lp'
      - '--image'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/conthunt-lp/website:$BUILD_ID'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      # nginx and the Next server share one container; 512Mi (the old static-only setting) is too tight.
      - '--memory=1Gi'
      # Without this the new image would inherit the previous revision's commit label.
      - '--update-labels=commit=${_COMMIT_SHA}'
      - '--remove-labels=source-commit'
  # Route 100% of traffic to the revision just deployed and keep following the latest revision
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'services'
      - 'update-traffic'
      - 'conthunt-lp'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--to-latest'
options:
  logging: CLOUD_LOGGING_ONLY
