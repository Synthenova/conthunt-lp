events {}
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server {
        listen 8080;
        root /usr/share/nginx/html;
        index index.html;

        # PostHog reverse proxy
        location ^~ /ingest/ {
            resolver 8.8.8.8 valid=30s;
            proxy_pass https://us.i.posthog.com/;
            proxy_set_header Host us.i.posthog.com;
            proxy_ssl_server_name on;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /assets/ {
            try_files $uri =404;
        }

        location /public/ {
            try_files $uri =404;
        }

        # Normalize trailing slash URLs to no-trailing-slash (except root)
        location ~ ^(.+)/+$ {
            return 301 $scheme://$host$1$is_args$args;
        }

        # Static site routing:
        # - serve files directly
        # - resolve directory-style routes to index.html
        # - return 404 for unknown paths so removed blog URLs do not look valid
        location / {
            try_files $uri $uri/index.html $uri/ =404;
        }
    }
}
