events {}
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server {
        listen 8080;
        root /usr/share/nginx/html;
        index index.html;

        # PostHog reverse proxy
        location ^~ /ingest/ {
            resolver 8.8.8.8 valid=30s;
            proxy_pass https://us.i.posthog.com/;
            proxy_set_header Host us.i.posthog.com;
            proxy_ssl_server_name on;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /assets/ {
            try_files $uri =404;
        }

        location /public/ {
            try_files $uri =404;
        }

        # Explicit redirects for merged or retired blog slugs.
        location = /blog/google-trends-youtube-guide {
            return 301 https://$host/blog/youtube-trending-searches;
        }
        location = /blog/google-trends-youtube-guide/ {
            return 301 https://$host/blog/youtube-trending-searches;
        }
        location = /blog/instagram-algorithm-guide {
            return 301 https://$host/blog/what-is-a-reel;
        }
        location = /blog/instagram-algorithm-guide/ {
            return 301 https://$host/blog/what-is-a-reel;
        }
        location = /blog/instagram-analytics-tools {
            return 301 https://$host/blog/best-instagram-analytics-tools;
        }
        location = /blog/instagram-analytics-tools/ {
            return 301 https://$host/blog/best-instagram-analytics-tools;
        }
        location = /blog/marketing-competitor-analysis {
            return 301 https://$host/blog/competitor-analysis-tools;
        }
        location = /blog/marketing-competitor-analysis/ {
            return 301 https://$host/blog/competitor-analysis-tools;
        }
        location = /blog/seo-competitor-analysis {
            return 301 https://$host/blog/competitor-analysis-tools;
        }
        location = /blog/seo-competitor-analysis/ {
            return 301 https://$host/blog/competitor-analysis-tools;
        }
        location = /blog/social-media-analytics-guide-2026 {
            return 301 https://$host/blog/multi-platform-analytics-strategy;
        }
        location = /blog/social-media-analytics-guide-2026/ {
            return 301 https://$host/blog/multi-platform-analytics-strategy;
        }
        location = /blog/tiktok-algorithm-guide {
            return 301 https://$host/blog/tiktok-content-strategy-business;
        }
        location = /blog/tiktok-algorithm-guide/ {
            return 301 https://$host/blog/tiktok-content-strategy-business;
        }
        location = /blog/tiktok-hashtags-hootsuite {
            return 301 https://$host/blog/tiktok-hashtags-go-viral;
        }
        location = /blog/tiktok-hashtags-hootsuite/ {
            return 301 https://$host/blog/tiktok-hashtags-go-viral;
        }
        location = /blog/tiktok-hashtags-sprout-social {
            return 301 https://$host/blog/tiktok-hashtags-go-viral;
        }
        location = /blog/tiktok-hashtags-sprout-social/ {
            return 301 https://$host/blog/tiktok-hashtags-go-viral;
        }
        location = /blog/youtube-shorts-complete-guide {
            return 301 https://$host/blog/youtube-shorts-best-practices;
        }
        location = /blog/youtube-shorts-complete-guide/ {
            return 301 https://$host/blog/youtube-shorts-best-practices;
        }
        location = /blog/youtube-shorts-format {
            return 301 https://$host/blog/youtube-shorts-best-practices;
        }
        location = /blog/youtube-shorts-format/ {
            return 301 https://$host/blog/youtube-shorts-best-practices;
        }
        location = /blog/youtube-shorts-thumbnail-best-practices-2026 {
            return 301 https://$host/blog/youtube-shorts-best-practices;
        }
        location = /blog/youtube-shorts-thumbnail-best-practices-2026/ {
            return 301 https://$host/blog/youtube-shorts-best-practices;
        }
        location = /blog/youtube-shorts-length-best-practices {
            return 301 https://$host/blog/youtube-shorts-best-practices;
        }
        location = /blog/youtube-shorts-length-best-practices/ {
            return 301 https://$host/blog/youtube-shorts-best-practices;
        }
        location = /blog/youtube-shorts-posting-frequency-best-practices-2026 {
            return 301 https://$host/blog/youtube-shorts-best-practices;
        }
        location = /blog/youtube-shorts-posting-frequency-best-practices-2026/ {
            return 301 https://$host/blog/youtube-shorts-best-practices;
        }
        location = /blog/youtube-shorts-best-practices-evergreen {
            return 301 https://$host/blog/youtube-shorts-best-practices;
        }
        location = /blog/youtube-shorts-best-practices-evergreen/ {
            return 301 https://$host/blog/youtube-shorts-best-practices;
        }
        location = /blog/content-intelligence {
            return 301 https://$host/blog/what-is-content-intelligence;
        }
        location = /blog/content-intelligence/ {
            return 301 https://$host/blog/what-is-content-intelligence;
        }
        location = /blog/instagram-reels-best-practices-2026 {
            return 301 https://$host/blog/instagram-reels-content-ideas;
        }
        location = /blog/instagram-reels-best-practices-2026/ {
            return 301 https://$host/blog/instagram-reels-content-ideas;
        }

        # Normalize trailing slash URLs to no-trailing-slash (except root)
        location ~ ^(.+)/+$ {
            return 301 https://$host$1$is_args$args;
        }

        # Static site routing:
        # - serve files directly
        # - resolve directory-style routes to index.html
        # - return 404 for unknown paths so removed blog URLs do not look valid
        location / {
            try_files $uri $uri/index.html $uri/ =404;
        }
    }
}
