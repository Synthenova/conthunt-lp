events {}
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Cloud Run and Cloudflare terminate TLS, so nginx itself only sees http. Pass their scheme on to Next
    # (redirects and absolute URLs must say https), and fall back to the local scheme when none was sent.
    map $http_x_forwarded_proto $forwarded_proto {
        default $scheme;
        ~.      $http_x_forwarded_proto;
    }

    server {
        listen 8080;
        root /usr/share/nginx/html;
        index index.html;

        # The Next.js marketing site (standalone server on 127.0.0.1:3000, started next to nginx by
        # docker-entrypoint.sh). The home page, /pricing, /resources/**, /viral-now/**, /v1/** (Next's
        # rewrite to the backend), /_next/**, /media/**, /brand/**, /robots.txt, /sitemap.xml, /llms.txt,
        # /og-default.jpg, the OG images and the 404 page all end up here: either by the explicit
        # locations below, or because no legacy file matches (see `location /` at the end).
        # Every rule after this block (PostHog, /skill, /mcp, .well-known, the blog 301/410 list) is
        # unchanged and takes precedence for its own paths.
        location @next {
            proxy_pass http://127.0.0.1:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_read_timeout 60s;
        }

        # Exact "/" and /_next/ go straight to Next. (`return 418` + error_page is nginx's way to hand a
        # request to a named location from a location that has no try_files; 418 is never sent.)
        location = / {
            error_page 418 = @next;
            return 418;
        }

        location ^~ /_next/ {
            error_page 418 = @next;
            return 418;
        }

        # The old static home page is gone; keep the URL working.
        location = /index.html {
            return 301 https://$host/;
        }

        # PostHog assets. This prefix is longer than /ingest/ and has to be declared as its own
        # location so array.js and its chunks are served from our domain.
        location ^~ /ingest/static/ {
            resolver 8.8.8.8 valid=30s;
            proxy_pass https://us-assets.i.posthog.com/static/;
            proxy_set_header Host us-assets.i.posthog.com;
            proxy_ssl_server_name on;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # PostHog API reverse proxy
        location ^~ /ingest/ {
            resolver 8.8.8.8 valid=30s;
            proxy_pass https://us.i.posthog.com/;
            proxy_set_header Host us.i.posthog.com;
            proxy_ssl_server_name on;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /assets/ {
            try_files $uri =404;
        }

        location /public/ {
            try_files $uri =404;
        }

        location = /skill {
            return 301 https://$host/docs/integrations/skill;
        }

        location = /mcp {
            return 301 https://$host/docs/integrations/mcp;
        }

        location ^~ /.well-known/skills/ {
            types {
                application/json json;
                text/markdown md;
                text/plain txt;
            }
            default_type text/plain;
            add_header Cache-Control "public, max-age=300";
            try_files $uri =404;
        }

