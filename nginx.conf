events {}
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server {
        listen 8080;
        root /usr/share/nginx/html;
        index index.html;

        add_header Content-Security-Policy "default-src 'self' https: data: blob:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https:; style-src 'self' 'unsafe-inline' https:; img-src 'self' https: data: blob:; connect-src 'self' https:; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://agent.conthunt.app" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # PostHog reverse proxy
        location ^~ /ingest/ {
            resolver 8.8.8.8 valid=30s;
            proxy_pass https://us.i.posthog.com/;
            proxy_set_header Host us.i.posthog.com;
            proxy_ssl_server_name on;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /assets/ {
            try_files $uri =404;
        }

        location /public/ {
            try_files $uri =404;
        }

        location = /install.sh {
            return 302 https://raw.githubusercontent.com/Synthenova/conthunt-cli/main/install.sh;
        }

        location = /install.ps1 {
            return 302 https://raw.githubusercontent.com/Synthenova/conthunt-cli/main/install.ps1;
        }

        location = /skill {
            return 301 https://$host/docs/integrations/skill;
        }

        location = /mcp {
            return 301 https://$host/docs/integrations/mcp;
        }

        location ^~ /.well-known/skills/ {
            types {
                application/json json;
                text/markdown md;
                text/plain txt;
            }
            default_type text/plain;
            add_header Cache-Control "public, max-age=300";
            try_files $uri =404;
        }

