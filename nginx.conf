        }
        location = /blog/youtube-shorts-ideas-without-showing-face/ {
            return 301 https://$host/blog/youtube-shorts-content-ideas;
        }

        # Normalize trailing slash URLs to no-trailing-slash (except root)
        location ~ ^(.+)/+$ {
            return 301 https://$host$1$is_args$args;
        }

        # Static site routing:
        # - serve files directly
        # - resolve directory-style routes to index.html
        # - return 404 for unknown paths so removed blog URLs do not look valid
        location / {
            try_files $uri $uri/index.html $uri/ =404;
        }
    }
