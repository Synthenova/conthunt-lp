events {}
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server {
        listen 8080;
        root /usr/share/nginx/html;
        index index.html;

        add_header Content-Security-Policy "default-src 'self' https: data: blob:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https:; style-src 'self' 'unsafe-inline' https:; img-src 'self' https: data: blob:; connect-src 'self' https:; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://agent.conthunt.app" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # PostHog reverse proxy
        location ^~ /ingest/ {
            resolver 8.8.8.8 valid=30s;
            proxy_pass https://us.i.posthog.com/;
            proxy_set_header Host us.i.posthog.com;
            proxy_ssl_server_name on;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /assets/ {
            try_files $uri =404;
        }

        location /public/ {
            try_files $uri =404;
        }

        # Explicit redirects for merged or retired blog slugs.
        location = /blog/google-trends-youtube-guide {
            return 301 https://$host/blog/youtube-trending-searches;
        }
        location = /blog/google-trends-youtube-guide/ {
            return 301 https://$host/blog/youtube-trending-searches;
        }
        location = /blog/instagram-algorithm-guide {
            return 301 https://$host/blog/what-is-a-reel;
        }
        location = /blog/instagram-algorithm-guide/ {
            return 301 https://$host/blog/what-is-a-reel;
        }
        location = /blog/instagram-analytics-tools {
            return 301 https://$host/blog/best-instagram-analytics-tools;
        }
        location = /blog/instagram-analytics-tools/ {
            return 301 https://$host/blog/best-instagram-analytics-tools;
        }
        location = /blog/marketing-competitor-analysis {
            return 301 https://$host/blog/competitor-analysis-tools;
