name: Deploy scripts

on:
  push:
    paths:
      - 'scripts/**'
      - 'site/scripts/**'
      - '.github/workflows/deploy-scripts.yml'
  pull_request:
    paths:
      - 'scripts/**'
      - 'site/scripts/**'
      - '.github/workflows/deploy-scripts.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: shellcheck
        run: shellcheck --version && shellcheck scripts/*.sh scripts/test/*.sh
      - name: promote.sh tests
        run: bash scripts/test/promote.test.sh
